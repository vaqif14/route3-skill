halal_business_profile_version: 1.0.0
instructions:
- Replace placeholders with facts. Mark unknown material fields as unknown; do not guess.
- Monthly profit is a target, not a guarantee.
- Choose a currency explicitly. Net profit is after all business costs and before or after owner tax only as stated.
- No agent may publish a listing, spend money, open an account, order stock, sign a supplier, send a campaign or make a binding claim
  without the configured approval.
- Internal halal screening does not replace a qualified Shariah scholar for ambiguous products, financing or contracts.
identity:
  business_case_id: HB-001
  founder_or_owner: <name>
  country_of_residence: Azerbaijan
  operating_country_or_markets:
  - <country>
  timezone: Asia/Baku
  preferred_language: Azerbaijani
  business_stage: idea
income_goal:
  target_type: monthly_net_profit
  currency: AZN
  target_min: '3000'
  target_max: '5000'
  target_deadline: <YYYY-MM or unknown>
  acceptable_ramp_months: <number>
  profit_definition: after product, production, shipping, platform, payment, ads, refunds, software and operating costs; tax treatment
    must be stated separately
  income_target_is_not_guaranteed: true
founder_constraints:
  starting_capital: <amount or unknown>
  maximum_loss_budget: <amount>
  weekly_hours: <hours>
  skills:
  - <skill>
  experience:
  - <experience>
  languages:
  - Azerbaijani
  - <other>
  risk_tolerance: low
  physical_storage_available: unknown
  can_create_original_designs: unknown
  can_provide_services: unknown
  willing_to_handle_customer_support: unknown
  preferred_business_types:
  - digital products
  - services
  - owned inventory
  - wholesale
  - original-design POD
  - transparent agency
  excluded_business_types: []
halal_and_ethics_policy:
  strictness: conservative screening; scholar review for ambiguity
  qualified_scholar_available: unknown
  prohibited_categories:
  - alcohol
  - gambling
  - adult content
  - interest-based lending
  - counterfeit or pirated products
  - deceptive marketing
  - fake reviews
  - unsafe or illegal goods
  financing_constraints:
  - no interest-bearing business financing unless independently approved as compliant
  dropshipping_rule: Do not approve by label alone. Map ownership, possession, agency, disclosure, seller responsibility and platform
    policy; escalate ambiguity.
  required_ethics:
  - truthful listings
  - genuine reviews
  - clear delivery and refund terms
  - no fake scarcity
  - no unsupported halal or performance claims

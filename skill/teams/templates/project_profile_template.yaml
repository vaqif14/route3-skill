  health_and_safety_requirements:
  - <requirement or none>
  insurance_requirements:
  - unknown
commercial_and_stakeholders:
  stakeholders:
  - name_or_group: <stakeholder>
    interest: <interest>
    influence: high
    engagement: <approach>
    owner: <owner>
  go_to_market_channels: []
  sales_or_sponsorship_pipeline: []
  communications_assets: []
  approved_public_claims: []
  prohibited_or_unverified_claims: []
measurement_and_reporting:
  north_star_metric: <metric>
  kpis:
  - name: <KPI>
    formula: <formula>
    baseline: unknown
    target: <target>
    frequency: weekly
    owner: <owner>
    source: <source>
  dashboard_audiences:
  - sponsor
  - project manager
  - workstream leads
  status_tolerance:
    schedule: <days or percent>
    cost: <percent>
    scope: no unapproved change
    quality: <threshold>
  benefit_review_dates: []
agent_configuration:

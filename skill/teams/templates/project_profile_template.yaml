    person: unassigned
    capacity: unknown
    source: internal
  meeting_cadence:
    executive: monthly
    project_control: weekly
    delivery: <weekly or daily>
    risk_review: monthly
  escalation_thresholds:
  - <threshold>
budget_schedule_and_resources:
  budget_status: not baselined
  budget_lines:
  - workstream: <workstream>
    estimate: unknown
    committed: '0'
    actual: '0'
    forecast_at_completion: unknown
    owner: <owner>
  management_reserve: unknown
  schedule_status: not baselined
  critical_deadlines: []
  resource_constraints: []
  procurement_items:
  - item: <item>
    required_by: <date>
    estimated_cost: unknown

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Route3 Control app icon: three agent routes converging into one outcome.
       macOS grid: 824×824 body centred in 1024, continuous-corner radius ≈ 185.
       Rendered to AppIcon.icns by make-icon.sh; edit this file, not the .icns. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3452"/>
      <stop offset="0.55" stop-color="#171C2E"/>
      <stop offset="1" stop-color="#0C0F1A"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.5" cy="0" r="0.62">
      <stop offset="0" stop-color="#9DB6FF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#9DB6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r1" x1="250" y1="0" x2="740" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C9CFF"/><stop offset="1" stop-color="#E9EFFF"/>
    </linearGradient>
    <linearGradient id="r2" x1="250" y1="0" x2="740" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FD6E8"/><stop offset="1" stop-color="#E9FBFF"/>
    </linearGradient>
    <linearGradient id="r3" x1="250" y1="0" x2="740" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A98BFF"/><stop offset="1" stop-color="#F1EBFF"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#89ABFF" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#5B82F0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3466D8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  </g>
  <g clip-path="url(#clip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#gloss)"/>
    <!-- faint grid: the "routing table" -->
    <g stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="2">
      <path d="M100 300H924M100 512H924M100 724H924M300 100V924M512 100V924M724 100V924"/>
    </g>
    <!-- route glow underlay -->
    <g fill="none" stroke-linecap="round" stroke-width="64" opacity="0.35" filter="url(#soft)">
      <path d="M262 356C480 356 520 512 736 512" stroke="#7C9CFF"/>
      <path d="M262 512H736" stroke="#4FD6E8"/>
      <path d="M262 668C480 668 520 512 736 512" stroke="#A98BFF"/>
    </g>
    <!-- the three routes -->
    <g fill="none" stroke-linecap="round" stroke-width="42">
      <path d="M262 356C480 356 520 512 736 512" stroke="url(#r1)"/>
      <path d="M262 512H736" stroke="url(#r2)"/>
      <path d="M262 668C480 668 520 512 736 512" stroke="url(#r3)"/>
    </g>
    <!-- agent origins -->
    <circle cx="262" cy="356" r="40" fill="#7C9CFF"/>
    <circle cx="262" cy="512" r="40" fill="#4FD6E8"/>
    <circle cx="262" cy="668" r="40" fill="#A98BFF"/>
    <g fill="#0C0F1A" opacity="0.55">
      <circle cx="262" cy="356" r="15"/><circle cx="262" cy="512" r="15"/><circle cx="262" cy="668" r="15"/>
    </g>
    <!-- converged outcome -->
    <circle cx="740" cy="512" r="190" fill="url(#halo)"/>
    <circle cx="740" cy="512" r="86" fill="#FFFFFF"/>
    <circle cx="740" cy="512" r="86" fill="none" stroke="#C9D7FF" stroke-width="6" opacity="0.8"/>
    <circle cx="740" cy="512" r="36" fill="#3466D8"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
